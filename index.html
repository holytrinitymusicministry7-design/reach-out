.bar.beat-bar{display:block;padding:4px 6px 4px;min-width:0;overflow:hidden}.beat-grid{display:grid;align-items:center;min-height:24px}.beat-slot{display:flex;justify-content:center;align-items:center;min-width:0}.beat-chord{white-space:nowrap;display:inline-block;max-width:none}.beat-dots{display:grid;margin-top:3px}.beat-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);opacity:.42;justify-self:center}

.acc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:2px 0;background:transparent;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}

.collapsible summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none}.collapsible summary::-webkit-details-marker{display:none}.collapsible summary:after{content:"+";font-size:20px}.collapsible[open] summary:after{content:"−"}.collapse-content{padding-top:10px}.modal-footer{justify-content:flex-end;padding-top:4px}button:disabled{opacity:.45;cursor:not-allowed}
.hide{display:none}

.bar{position:relative;font-family:var(--chord-font,inherit)}

.font-list{display:grid;gap:6px;margin:8px 0}

.bar.rs{border-left:5px double var(--ink);padding-left:20px}

    var b=FBDB.batch();
    list.slice(i,i+400).forEach(function(l){var data=JSON.parse(JSON.stringify(l));data.u=l.u||Date.now();b.set(FBDB.collection("songs").doc(String(l.id)),data)});

    var pending=songs.filter(function(l){return syncable(l)&&sent[l.id]!==sig(l)});
    if(pending.length){
      status("☁ Syncing…");
      await pushSongs(pending);
      pending.forEach(function(l){sent[l.id]=sig(l)});

    }
    status(syncedStamp());
  }catch(e){status(/permission|insufficient/i.test(String(e&&e.message||e))?"Firebase denied access. Check the published Firestore rules and approved UID.":"Firebase sync problem: "+String(e&&e.message||e).slice(0,160))}

      var j=songs.findIndex(function(x){return x.id===d.id}),l=j>=0?songs[j]:null;
      if(l&&(d.u||0)<=(l.u||0))return;
      if(l&&view==="song"&&cur===l.id&&(mode==="edit"||isCreatingSong))return; /* never overwrite a song being edited right now */
      d.u=d.u||0;
      if(j>=0)songs[j]=d;else songs.push(d);
      sent[d.id]=sig(d);ids.push(d.id);
    });
    if(ids.length){store();afterRemote(ids)}
    if(first&&isAdmin()){
      /* first load: also upload anything that exists only on this device or is newer here */
      var rmap={};snap.docs.forEach(function(x){rmap[x.id]=(x.data()||{}).u||0});
      var pend=songs.filter(function(l){return syncable(l)&&(!(l.id in rmap)||(l.u||0)>(rmap[l.id]||0))});
      if(pend.length)pushSongs(pend).then(function(){pend.forEach(function(l){sent[l.id]=sig(l)});store()}).catch(function(e){status(syncErr(e))});
    }
    status(syncedStamp());
  },function(e){

}

/* ---------- Auto bars-per-line layout ---------- */
function autoBarWidth(cell,fs){
  var beatBar=cell.classList.contains("beat-bar");
  var chords=beatBar?Array.prototype.slice.call(cell.querySelectorAll(".beat-chord")):Array.prototype.filter.call(cell.children,function(c){return c.tagName==="SPAN"&&!c.classList.contains("end")});
  var tw=0,maxc=0;
  chords.forEach(function(c){
    var t=(c.textContent||"").length,sp=0;
    c.querySelectorAll(".ex,.bs").forEach(function(u){sp+=(u.textContent||"").length});
    var w=((t-sp)+sp*0.55)*0.6*fs;tw+=w;if(w>maxc)maxc=w;
  });
  var k=Math.max(1,chords.length),w=tw+(k-1)*fs*0.45+fs*0.9;
  if(beatBar){
    var grid=cell.querySelector(".beat-grid"),beats=grid?grid.children.length:4;
    w=Math.max(w,beats*Math.max(maxc-8,fs*0.9));
  }
  w=Math.max(w,fs*2.4);
  if(cell.classList.contains("rs"))w+=16;
  if(cell.classList.contains("re"))w+=16;
  return w+4;
}
function autoLayoutOne(el){
  if(!el._cells)el._cells=Array.prototype.slice.call(el.children).filter(function(c){return c.classList.contains("bar")});
  var cells=el._cells;if(!cells.length)return;
  var W=el.clientWidth-2;if(W<40)return;
  var fs=parseFloat(getComputedStyle(cells[0]).fontSize)||20;
  var nat=cells.map(function(c){return autoBarWidth(c,fs)});
  var marks=cells.map(function(c){return c.getAttribute("data-ts")||""});
  function tw(l){var p=tsParts(l);return p?Math.max(p[0].length,p[1].length)*0.6*fs*0.7*0.72+4:0}
  function gOut(m){return m?tw(m)+4:0}
  function gMid(m){return m?tw(m)+8:0}
  function pack(limit){
    var lines=[],cur=[],sum=0,lim=limit;
    cells.forEach(function(_,i){
      var m=marks[i];
      if(cur.length){var w=nat[i]+gMid(m);if(sum+w<=lim){cur.push(i);sum+=w;return}lines.push(cur)}
      cur=[i];lim=limit-gOut(m);sum=nat[i];
    });
    if(cur.length)lines.push(cur);return lines;
  }
  var lines=pack(W);
  if(lines.length>1){
    var total=0,maxn=0,maxo=0;
    nat.forEach(function(w,i){total+=w+gMid(marks[i]);if(w>maxn)maxn=w;if(gOut(marks[i])>maxo)maxo=gOut(marks[i])});
    var bal=pack(Math.min(W,Math.max(total/lines.length*1.12,maxn+maxo)));
    if(bal.length<=lines.length)lines=bal;
  }
  function tsEl(l,mid){var d=document.createElement("div");d.innerHTML=tsigHTML(l,mid);return d.firstChild}
  el.innerHTML="";
  lines.forEach(function(ids){
    var ln=document.createElement("div");ln.className="line";ln.style.width="100%";
    var cols=[];
    ids.forEach(function(i,k){
      if(k>0&&marks[i]){ln.appendChild(tsEl(marks[i],true));cols.push("auto")}
      cols.push("minmax(0,"+nat[i].toFixed(1)+"fr)");ln.appendChild(cells[i]);
    });

function parseBulkSongs(text){
  var lines=String(text||"").replace(/\r/g,"").replace(/[\u2018\u2019]/g,"'").split("\n");
  var out=[],cur=null,SEP=/^\s*(#{3,}|-{3,}|={3,}|\*{3,}|_{3,})\s*$/;
  function fresh(){return{title:"",artist:"",key:"",ts:"",std:[],chart:[],sec:null,body:false}}
  function push(){if(cur&&(cur.title||cur.artist||cur.key||cur.ts||cur.std.length||cur.chart.length))out.push(cur);cur=null}
  lines.forEach(function(raw){
    var l=raw.replace(/\u00a0/g," "),m;
    if(SEP.test(l)){push();return}
    if((m=/^\s*title\s*[:\-]\s*(.*)$/i.exec(l))){if(cur&&cur.body)push();if(!cur)cur=fresh();cur.title=m[1].trim();return}
    if(!cur)cur=fresh();
    if(!cur.body){
      if((m=/^\s*artist\s*[:\-]\s*(.*)$/i.exec(l))){cur.artist=m[1].trim();return}
      if((m=/^\s*key(?:\s*signature)?\s*[:\-]\s*(.*)$/i.exec(l))){cur.key=m[1].trim();return}
      if((m=/^\s*time(?:\s*signature)?\s*[:\-]\s*(.*)$/i.exec(l))){cur.ts=m[1].trim();return}
    }
    if((m=/^\s*(standard|chords?|bar\s*charts?)\s*:\s*(.*)$/i.exec(l))){
      cur.sec=/^standard$/i.test(m[1])?"std":"chart";cur.body=true;
      if(m[2].trim())(cur.sec==="std"?cur.std:cur.chart).push(m[2]);return;
    }
    if(!cur.sec){
      if(!l.trim())return;
      cur.body=true;(/^\s*\|/.test(l)?cur.chart:cur.std).push(l);return;
    }
    cur.body=true;(cur.sec==="std"?cur.std:cur.chart).push(l);
  });
  push();
  function tb(a){return a.join("\n").replace(/^\s*\n+/,"").replace(/\s+$/,"")}
  return out.map(function(x,i){
    var std=tb(x.std),chart=tb(x.chart),key="C";
    if(x.key){try{key=normKey(x.key)||"C"}catch(e){key="C"}}
    var song={id:uid()+i.toString(36),title:x.title||("Song "+(i+1)),artist:x.artist||"",key:key,chart:chart,pl:4,ts:/^\d{1,2}\/\d{1,2}$/.test(x.ts)?x.ts:"4/4",viewMode:std?"standard":"chord"};
    if(std)song.standardText=std;
    return song;
  });
}

function metroPulse(beat,downbeat,subdivision){

function metroScheduleTick(time,step){
  var subdiv=step%metroClicksPerBeat,beat=Math.floor(step/metroClicksPerBeat)%metroBeatsPerBar,downbeat=beat===0&&subdiv===0;
  var freq=downbeat?1760:(subdiv===0?1120:760),vol=downbeat?.32:(subdiv===0?.19:.10);
  metroPlayClick(time,freq,vol,downbeat?.045:.032);
  var delay=Math.max(0,(time-metroAudioContext.currentTime)*1000),id=setTimeout(function(){metroPendingVisualTimers=metroPendingVisualTimers.filter(function(t){return t!==id});if(metroPlaying)metroPulse(beat,downbeat,subdiv)},delay);
  metroPendingVisualTimers.push(id);

function metroResetSchedule(){
  if(!metroPlaying||!metroAudioContext)return;
  if(metroScheduler){clearInterval(metroScheduler);metroScheduler=null;}
  metroStep=0;metroNextTime=metroAudioContext.currentTime+.06;
  metroScheduler=setInterval(function(){
    if(!metroPlaying||!metroAudioContext)return;
    while(metroNextTime<metroAudioContext.currentTime+.12){
      var stepNow=metroStep;
      metroScheduleTick(metroNextTime,stepNow);
      metroNextTime+=60/metroBpm/metroClicksPerBeat;
      metroStep=(metroStep+1)%(metroBeatsPerBar*metroClicksPerBeat);
    }
  },25);
}
function stopMetronome(shouldDraw){
  metroPlaying=false;
  if(metroScheduler){clearInterval(metroScheduler);metroScheduler=null;}
  metroPendingVisualTimers.forEach(function(id){clearTimeout(id)});metroPendingVisualTimers=[];
  if(metroVisualClearTimer){clearTimeout(metroVisualClearTimer);metroVisualClearTimer=0;}
  if(metroAudioContext){var ctx=metroAudioContext;metroAudioContext=null;try{if(ctx.state!=='closed')ctx.close()}catch(e){}}
  if(shouldDraw&&toolsPage&&metronomeOpen)draw();
}
async function startMetronome(){
  if(metroPlaying){stopMetronome(false);draw();return;}
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){toast('Your browser does not support Web Audio for the metronome.',3500);return;}
  try{
    metroAudioContext=new AC();if(metroAudioContext.state==='suspended')await metroAudioContext.resume();
    metroPlaying=true;metroStep=0;metroResetSchedule();draw();
  }catch(e){stopMetronome(false);toast('Could not start audio. Check your browser audio settings and try again.',4000);draw();}
}

function detectTunerFrequency(input, sampleRate){
  /* McLeod Pitch Method (normalised square difference) with a proper low-pass before decimating.
     This is much more accurate than the old 4x-decimated YIN: no aliasing, finer sample resolution,
     sub-sample peak interpolation, and less chance of octave errors. */

  if(dec===2){
    // 5-tap binomial low-pass [1 4 6 4 1]/16, then keep every second sample.
    for(i=0;i<M;i++){
      var k=i*2,
        a0=input[k-2]===undefined?input[k]:input[k-2],a1=input[k-1]===undefined?input[k]:input[k-1],
        a3=input[k+1]===undefined?input[k]:input[k+1],a4=input[k+2]===undefined?input[k]:input[k+2];
      x[i]=(a0+4*a1+6*input[k]+4*a3+a4)/16-mean;
    }

  var rms=0;for(i=0;i<M;i++)rms+=x[i]*x[i];rms=Math.sqrt(rms/M);

    maxTau=Math.min(Math.floor(rate/35),Math.floor(M/2)),
    minTau=Math.max(2,Math.floor(rate/1400)),

  var sq=new Float64Array(M+1);
  for(i=0;i<M;i++)sq[i+1]=sq[i]+x[i]*x[i];

  for(tau=0;tau<=maxTau;tau++){
    sum=0;
    for(j=0;j<W;j++)sum+=x[j]*x[j+tau];
    var m=sq[W]+(sq[W+tau]-sq[tau]);
    nsdf[tau]=m>0?2*sum/m:0;
  }
  // Collect the highest point of each positive lobe (after the first zero crossing).
  var peaks=[],pos=1;

// Pause auto-collapse while the reader is pressing, transposing, or dragging.

/* ---------- Two-finger pinch to zoom (View mode) ---------- */
var pinchState=null;
function pinchDist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy)}
document.addEventListener("touchstart",function(e){
  if(view!=="song"||mode!=="view"||e.touches.length!==2)return;
  var t=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);
  if(t&&t.closest&&t.closest("#xposeFab"))return;

},{passive:true,capture:true});

  if(!pinchState)return;

document.addEventListener("touchcancel",endPinch,{passive:true,capture:true});

/* ---------- mobile system-back navigation ---------- */
var navRestoring=false,navReady=false,lastHomeBack=0,baseDraw=draw;
function mobileNavState(){
  return {
    view:view,cur:cur,mode:mode,isCreatingSong:isCreatingSong,practice:!!practiceMode&&view==="song",
    toolsPage:toolsPage,tunerOpen:tunerOpen,metronomeOpen:metronomeOpen,
    scaleToolOpen:scaleToolOpen,chordToolStage:chordToolStage,
    addOpen:addOpen,addView:addView,sidebarOpen:sidebarOpen,cloudOpen:cloudOpen,
    groupSongPickerOpen:groupSongPickerOpen,groupsMgrOpen:groupsMgrOpen,gedit:gedit

}

}

var NAV_SS="chordbook:v1:nav",navScrollT=0;

function updatePracticeButtonVisibility(){

}
window.addEventListener("scroll",updatePracticeButtonVisibility,{passive:true});
draw=function(){
  baseDraw();

  var next=mobileNavState(),current=history.state&&history.state.chordbook;

    /* Swiping from one song to another is not a new "page": replace the history entry so Back returns to the list. */
    var sameSongView=current&&current.view==="song"&&next.view==="song"&&current.mode===next.mode&&
      mobileNavKey(Object.assign({},current,{cur:0}))===mobileNavKey(Object.assign({},next,{cur:0}));
    var practiceOffOnly=current&&current.practice&&!next.practice&&
      mobileNavKey(Object.assign({},current,{practice:false}))===mobileNavKey(next);
    /* Leaving practice with the on-screen button: reuse the entry so Back does not re-open practice. */

};
window.addEventListener("popstate",function(e){
  var target=e.state&&e.state.chordbook,current=mobileNavState();
